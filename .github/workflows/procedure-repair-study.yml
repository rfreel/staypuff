name: Procedure Lab repair study
on:
  pull_request:
    paths:
      - 'projects/procedure-lab/repair-study/**'
      - '.github/workflows/procedure-repair-study.yml'
  workflow_dispatch:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          mkdir -p /tmp/procedure-headers
          curl --fail -L https://raw.githubusercontent.com/raysan5/raylib/5.5/src/raylib.h -o /tmp/procedure-headers/raylib.h
          echo "afb287ecd313de61e0000921375190b7e1cc35cd381ad6caf914489473a3c871  /tmp/procedure-headers/raylib.h" | sha256sum -c -
      - name: Native invariants and CPU smoke
        env:
          RAYLIB_INCLUDE: /tmp/procedure-headers
        run: |
          bash projects/procedure-lab/repair-study/verify.sh
          python projects/procedure-lab/repair-study/run.py --output /tmp/study-smoke --steps 16384 --seeds 7 --episodes 16 --arms control exploration curriculum
          python projects/procedure-lab/repair-study/original_diagnostics.py /tmp/pilot-replay
