name: PufferVis / Household World
on:
  pull_request:
    paths:
      - 'projects/household-world/**'
      - 'ocean/household/**'
      - 'src/puffervis.h'
      - '.github/workflows/puffervis-check.yml'
  push:
    branches: ['5.0']
    paths:
      - 'projects/household-world/**'
      - 'ocean/household/**'
      - 'src/puffervis.h'
      - '.github/workflows/puffervis-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/household-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulation and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[web,test]' httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run all unit and adapter tests
        run: python -m pytest -q
      - name: Native Ocean adapter smoke test
        run: bash scripts/build_native.sh
      - name: Validate browser renderer syntax
        run: |
          node --check web/puffervis.js
          node --check web/app.js
      - name: Validate PufferVis scene protocol on sample
        run: |
          python -m pip install jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from household.world import HouseholdWorld
          from household.scene import project_household_scene
          schema=json.loads(Path('schemas/puffervis.scene.v1.json').read_text())
          validator=Draft202012Validator(schema)
          validator.validate(project_household_scene(HouseholdWorld().state()))
          validator.validate(json.loads(Path('examples/puffervis_warehouse.json').read_text()))
          print('PufferVis scene schema PASS')
          PY
